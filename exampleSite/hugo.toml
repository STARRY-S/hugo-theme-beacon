baseURL = "https://beacon-demo.starry-s.moe/"
title = "Beacon Demo"
# Repository-only relative theme path. This file is a feature demo, not a
# starter configuration; use the root hugo.example.toml for a new site.
theme = "../.."
enableRobotsTXT = true

# ── Multilingual ────────────────────────────────────────────
defaultContentLanguage = "en"      # English served at "/", others under /zh-cn/, /zh-tw/, /ja/
# defaultContentLanguageInSubdir = true   # uncomment to serve English under /en/ too
hasCJKLanguage = true              # correct word/character counts for CJK content

# ── Pagination ──────────────────────────────────────────────
# Posts per page on the homepage and taxonomy pages. Section lists (/posts/)
# are a year timeline and show everything on one page.
[pagination]
  pagerSize = 5

# ── Shared params (translatable strings are overridden per language below) ──
[params]
  timelineDateFormat = "01-02"   # month/day on section timelines (year is the heading)
  mainSections = ["posts"]
  author = "Jane Doe"

  showReadingTime = true
  showWordCount = true
  showAuthor = true
  showSummary = true
  showToc = true
  showBreadcrumbs = true
  showShareButtons = true

  # Load the Iconify CDN so any "prefix:name" icon works (see the Telegram
  # entry below). Curated short names still render as inline SVG regardless.
  iconify = true

  # ── Footer ────────────────────────────────────────────────
  [params.footer]
    since = ""                     # start year; omit for the current year alone
    owner = "Jane Doe"           # defaults to the site title
    showPoweredBy = true

    [params.footer.license]
      name = "CC BY-NC-SA 4.0"
      url  = "https://creativecommons.org/licenses/by-nc-sa/4.0/"

    [params.footer.hostedOn]
      name = "GitHub Pages"
      url  = "https://pages.github.com/"

  # ── Comments ──────────────────────────────────────────────
  # Pick one provider and fill in its table. The widget is only fetched once a
  # reader scrolls near the bottom of a post, and it follows the theme toggle.
  # The demo runs giscus against this theme's own repo — comments land in its
  # GitHub Discussions.
  [params.comments]
    enabled  = true
    provider = "giscus"          # disqus | giscus | utterances | waline

    [params.comments.giscus]
      repo = "STARRY-S/hugo-theme-beacon"
      repoId = "R_kgDOTVjf5g"
      category = "Announcements"
      categoryId = "DIC_kwDOTVjf5s4DBMRo"
      mapping = "pathname"
      reactionsEnabled = "1"
      inputPosition = "bottom"

  # Other providers — swap `provider` above and fill one of these in:
  #
  #   [params.comments.disqus]
  #     shortname = "your-disqus-shortname"
  #
  #   [params.comments.utterances]
  #     repo = "user/repo"
  #     issueTerm = "pathname"
  #     label = "comment"
  #
  #   [params.comments.waline]
  #     serverURL = "https://your-waline.vercel.app"

  # ── Sponsor ───────────────────────────────────────────────
  # A collapsible "buy me a coffee" block at the bottom of single pages.
  # enabled turns it on globally; front matter `sponsor = false` hides it on a
  # given page. Each item shows a QR + title + badge/subtitle + optional copyable
  # address. QR per item: `qr` image (assets/ or static/) → `qrtext` → `address`;
  # the last two are rendered to a PNG at build time (Hugo images.QR, no JS).
  [params.sponsor]
    enabled = true
    # text = "Buy Me a Coffee"   # optional label; defaults to i18n "sponsor"
    # Optional per-item `color` recolors the QR modules (a solid overlay in
    # mix-blend-mode: screen). Prefer reasonably dark shades — very light colors
    # (bright yellow/orange) cut the module/background contrast and can hurt
    # scanning. Omit `color` to keep a plain black QR.
    [[params.sponsor.items]]
      title = "Bitcoin"
      address = "abcabcabcabcfakeaddressplacehoderfakeaddress"
      badge = "BTC"
      color = "#d9821a"   # ginger / orange
    [[params.sponsor.items]]
      title = "Ethereum"
      address = "abcabcabcabcfakeaddressplacehoderfakeaddress"
      badge = "ETH"
      color = "#6f5bd1"   # purple
    [[params.sponsor.items]]
      title = "Arbitrum"
      address = "abcabcabcabcfakeaddressplacehoderfakeaddress"
      badge = "ARB"
      color = "#1a86d9"   # blue / cyan
    [[params.sponsor.items]]
      title = "WeChat Pay"
      qrtext = "wxp://demo-wechat-pay-placeholder"
      subtitle = "Scan to Pay"
      color = "#07a854"   # green
  #   [[params.sponsor.items]]        # payment-app QR as an image instead:
  #     title = "Alipay"
  #     qr = "images/alipay.png"
  #     subtitle = "Scan to Pay"

  [[params.social]]
    name = "GitHub"
    icon = "github"
    url = "https://github.com/starry-s"
  [[params.social]]
    name = "Telegram"
    icon = "simple-icons:telegram"   # via Iconify CDN (params.iconify = true)
    url = "https://t.me/"
  [[params.social]]
    name = "X"
    icon = "x"
    url = "https://x.com/"
  [[params.social]]
    name = "RSS"
    icon = "rss"
    url = "/index.xml"

  # Sidebar — structural bits are shared; per-language overrides (author /
  # description / itemsTitle) live in each [languages.*.params.sidebar] below.
  [params.sidebar]
    enabled = true
    position = "left"          # "left" or "right"
    avatar = "/images/avatar.svg"
    showStats = true
    author = "Jane Doe"
    description = "Developer & writer. Sharing notes on code, design, and side projects."
    itemsTitle = "Elsewhere"

    [[params.sidebar.buttons]]
      name = "Email me"
      icon = "email"
      url = "mailto:jane@example.com"
    [[params.sidebar.buttons]]
      name = "LinkedIn"
      icon = "linkedin"
      url = "https://www.linkedin.com/"

    [[params.sidebar.items]]
      name = "Portfolio"
      pageRef = "/about"
    [[params.sidebar.items]]
      name = "Résumé"
      pageRef = "/about"

    [[params.sidebar.friends]]
      name = "Hugo"
      url = "https://gohugo.io/"
    [[params.sidebar.friends]]
      name = "A Friend's Blog"
      url = "https://example.com/"
    [[params.sidebar.friends]]
      name = "Another Blog"
      url = "https://example.org/"

[taxonomies]
  tag = "tags"
  category = "categories"

# ── Image EXIF ──────────────────────────────────────────────
# Hugo strips EXIF by default; opt the gallery's camera/lens/exposure fields
# back in so the lightbox can show them. (Location/GPS stays disabled.)
[imaging.meta]
  sources = ["exif"]
  fields = ["**", "! *GPS*"]

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
    codeFences = true
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
  # ── Math (LaTeX) ──────────────────────────────────────────
  # Lets Goldmark hand $$…$$ / \(…\) spans to the theme's render hook, which
  # typesets them with KaTeX at build time (no client-side JS). Inline `$…$`
  # is deliberately not enabled — it collides with prose like "$5 and $10".
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)']]

# ── Languages ───────────────────────────────────────────────
[languages]

  [languages.en]
    locale = "en-US"
    weight = 1
    title = "Beacon Demo"
    [languages.en.params]
      languageLabel = "English"
      description = "A clean, fast, modern blog theme for Hugo with a dual-column card layout."
    [languages.en.menu]
      [[languages.en.menu.main]]
        name = "Posts"
        pageRef = "/posts"
        weight = 1
      [[languages.en.menu.main]]
        name = "Tags"
        pageRef = "/tags"
        weight = 2
      [[languages.en.menu.main]]
        name = "Gallery"
        pageRef = "/gallery"
        weight = 3
      [[languages.en.menu.main]]
        name = "About"
        pageRef = "/about"
        weight = 4

  [languages.zh-cn]
    locale = "zh-CN"
    weight = 2
    title = "Beacon Demo"
    [languages.zh-cn.params]
      languageLabel = "简体中文"
      author = "张三"
      description = "一款简洁、快速、现代的 Hugo 博客主题，采用双栏卡片布局。"
      [languages.zh-cn.params.sidebar]
        author = "张三"
        description = "开发者 & 作者。分享关于代码、设计与业余项目的笔记。"
        itemsTitle = "其他"
    [languages.zh-cn.menu]
      [[languages.zh-cn.menu.main]]
        name = "文章"
        pageRef = "/posts"
        weight = 1
      [[languages.zh-cn.menu.main]]
        name = "标签"
        pageRef = "/tags"
        weight = 2
      [[languages.zh-cn.menu.main]]
        name = "关于"
        pageRef = "/about"
        weight = 3

  [languages.zh-tw]
    locale = "zh-TW"
    weight = 3
    title = "Beacon Demo"
    [languages.zh-tw.params]
      languageLabel = "繁體中文"
      author = "張三"
      description = "一款簡潔、快速、現代的 Hugo 部落格主題，採用雙欄卡片版面。"
      [languages.zh-tw.params.sidebar]
        author = "張三"
        description = "開發者 & 作者。分享關於程式碼、設計與業餘專案的筆記。"
        itemsTitle = "其他"
    [languages.zh-tw.menu]
      [[languages.zh-tw.menu.main]]
        name = "文章"
        pageRef = "/posts"
        weight = 1
      [[languages.zh-tw.menu.main]]
        name = "標籤"
        pageRef = "/tags"
        weight = 2
      [[languages.zh-tw.menu.main]]
        name = "關於"
        pageRef = "/about"
        weight = 3

  [languages.ja]
    locale = "ja-JP"
    weight = 4
    title = "Beacon Demo"
    [languages.ja.params]
      languageLabel = "日本語"
      author = "山田花子"
      description = "デュアルカラムのカードレイアウトを備えた、クリーンで高速なモダンな Hugo ブログテーマ。"
      [languages.ja.params.sidebar]
        author = "山田花子"
        description = "開発者 & ライター。コード、デザイン、時々サイドプロジェクトについて綴っています。"
        itemsTitle = "その他"
    [languages.ja.menu]
      [[languages.ja.menu.main]]
        name = "記事"
        pageRef = "/posts"
        weight = 1
      [[languages.ja.menu.main]]
        name = "タグ"
        pageRef = "/tags"
        weight = 2
      [[languages.ja.menu.main]]
        name = "概要"
        pageRef = "/about"
        weight = 3
