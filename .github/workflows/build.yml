name: Build

# Fast validation that the theme still builds the example site.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      # Hugo does not embed Dart Sass; the SCSS is transpiled with it (main.scss
      # uses the @use module system, which libsass never supported).
      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Link theme into example site
        run: |
          mkdir -p exampleSite/themes
          ln -sfn ../.. exampleSite/themes/beacon

      - name: Build
        run: hugo --gc --minify --source exampleSite
