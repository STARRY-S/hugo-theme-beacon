<footer class="footer">
  {{- with site.Params.social }}
    <div class="social-icons">
      {{- range . }}
        <a href="{{ .url }}" target="_blank" rel="noopener noreferrer me" aria-label="{{ .name }}" title="{{ .name }}">
          {{ partial "svg.html" .icon }}
        </a>
      {{- end }}
    </div>
  {{- end }}
  <div class="copyright">
    <span>© {{ now.Year }} {{ site.Title }}</span>
    {{- with site.Copyright }}<span>{{ . }}</span>{{ end }}
    <span>Powered by <a href="https://gohugo.io/" rel="noopener noreferrer" target="_blank">Hugo</a> &amp; <a href="https://github.com/starry-s/hugo-theme-pascal" rel="noopener noreferrer" target="_blank">Pascal</a></span>
  </div>
</footer>
