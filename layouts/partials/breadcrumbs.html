<nav class="breadcrumbs" aria-label="Breadcrumb">
  <a href="{{ site.Home.RelPermalink }}">{{ i18n "home" | default "Home" }}</a>
  {{- range .Ancestors.Reverse }}
    {{- if not .IsHome }}
      <span class="sep">/</span>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{- end }}
  {{- end }}
  <span class="sep">/</span>
  <span class="current">{{ .Title }}</span>
</nav>
