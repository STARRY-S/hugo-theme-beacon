<div class="share-buttons">
  <span class="share-label">{{ i18n "share" | default "Share" }}:</span>
  <a href="https://twitter.com/intent/tweet?url={{ .Permalink }}&text={{ .Title }}" target="_blank" rel="noopener noreferrer" aria-label="Share on X/Twitter">{{ partial "svg.html" "twitter" }}</a>
  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ .Permalink }}" target="_blank" rel="noopener noreferrer" aria-label="Share on LinkedIn">{{ partial "svg.html" "linkedin" }}</a>
  <a href="mailto:?subject={{ .Title }}&body={{ .Permalink }}" aria-label="Share via email">{{ partial "svg.html" "email" }}</a>
</div>
