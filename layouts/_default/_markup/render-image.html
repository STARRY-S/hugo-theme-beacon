{{- /* Content image render hook.

       Adds lazy-loading + async decoding, marks the image "zoomable" so
       image-preview.js can open it in a full-screen lightbox, and — when the
       Markdown title is set: ![alt](src "title") — renders a <figcaption>.

       Opt out of the lightbox for a single image by ending its title with
       "#noZoom", e.g. ![logo](logo.png "Our logo #noZoom"). */ -}}
{{- $alt := .PlainText -}}
{{- $title := .Title -}}
{{- $noZoom := false -}}
{{- if strings.HasSuffix $title "#noZoom" -}}
  {{- $noZoom = true -}}
  {{- $title = strings.TrimSuffix "#noZoom" $title | strings.TrimRight " " -}}
{{- end -}}
{{- if .IsBlock }}<figure class="post-figure">{{ end -}}
{{- partial "responsive-image.html" (dict
      "src" .Destination
      "page" .Page
      "alt" $alt
      "title" $title
      "class" (cond $noZoom "" "zoomable")
      "full" (not $noZoom)
      "preserveOriginal" true
      "sizes" "(max-width: 760px) 100vw, 720px"
      "widths" (slice 720 1440)
) -}}
{{- if .IsBlock -}}
  {{- with $title }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>{{- end -}}
