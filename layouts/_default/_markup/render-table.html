{{- /* Wrap markdown tables in a scroll container so wide tables scroll
       inside the card instead of overflowing the page on small screens */ -}}
<div class="table-wrapper">
  <table
    {{- range $k, $v := .Attributes }}
      {{- if $v }}{{ printf " %s=%q" $k $v | safeHTMLAttr }}{{ end }}
    {{- end }}>
    <thead>
      {{- range .THead }}
      <tr>
        {{- range . }}
        <th{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{- .Text -}}</th>
        {{- end }}
      </tr>
      {{- end }}
    </thead>
    <tbody>
      {{- range .TBody }}
      <tr>
        {{- range . }}
        <td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{- .Text -}}</td>
        {{- end }}
      </tr>
      {{- end }}
    </tbody>
  </table>
</div>
